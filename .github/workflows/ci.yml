name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: repository-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      qualify_image: ${{ steps.scope.outputs.qualify_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Keep one stable CI workflow for every candidate, but reserve the
      # roughly ten-minute clean image and boot path for changes that can
      # affect produced artifacts or their runtime qualification. Explicitly
      # isolated policy, reporting, and host-tool paths skip it. Unknown paths
      # deliberately take the safe path and qualify.
      - name: Decide whether runtime qualification is needed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          qualify=true
          if [ "${EVENT_NAME}" = "push" ]; then
            # Protected main already received exact-head candidate evidence.
            # Re-run the fast source gates on the squash commit so the branch
            # has an honest visible status without rebuilding OS artifacts.
            qualify=false
            if [ -n "${BEFORE_SHA}" ] &&
               [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              base="${BEFORE_SHA}"
            else
              base=""
            fi
          elif [ "${EVENT_NAME}" != "workflow_dispatch" ]; then
            if [ "${EVENT_NAME}" = "pull_request" ]; then
              base="${BASE_SHA}"
            elif [ -n "${BEFORE_SHA}" ] &&
                 [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] &&
                 git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              base="${BEFORE_SHA}"
            else
              base=""
            fi

            if [ -n "${base}" ]; then
              qualify=false
              mapfile -t changed < <(git diff --name-only "${base}" "${HEAD_SHA}")
              for path in "${changed[@]}"; do
                case "${path}" in
                  *.md|docs/*|LICENSE|LICENSES/*|.github/ISSUE_TEMPLATE/*|\
                  .github/dependabot.yml|.github/workflows/coverage.yml|\
                  .github/workflows/security.yml|codecov.yml|deny.toml|\
                  components/flash/deny.toml|flashos.sh|flashos.zsh|\
                  tools/flashos/*|ci/check_coverage.py|\
                  ci/tests/test_check_coverage.py)
                    ;;
                  *)
                    qualify=true
                    break
                    ;;
                esac
              done
            fi
          fi
          echo "qualify_image=${qualify}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${base:-}" >> "${GITHUB_OUTPUT}"
          echo "Image and QEMU qualification required: ${qualify}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: root-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: root-cargo-${{ runner.os }}-

      - name: Activate the pinned root toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Formatting
        run: cargo fmt --all --check

      - name: Build-system tests
        run: cargo test --locked

      # Product contracts, the QEMU harness, and host developer tools are held
      # to the same source-quality standard as the Rust workspaces.
      - name: Check the FlashOS Python
        run: |
          pipx install ruff==0.16.0
          ruff check ci/ tools/flashos/
          python3 -m unittest discover -s ci/tests -p 'test_*.py'
          python3 -m unittest discover -s tools/flashos/tests -p 'test_*.py'

      - name: Validate package, TUI, shell, identity, and audio policy
        run: python3 ci/check_profile.py

      - name: Validate the FlashOS platform source baseline
        run: python3 ci/check_flashos_platform.py

      - name: Validate the FlashOS capability evidence inventory
        run: python3 ci/check_flashos_capabilities.py

      - name: Validate the FlashOS platform operation map
        run: python3 ci/check_flashos_operation_map.py

      - name: Validate the FlashOS platform capability classification
        run: python3 ci/check_flashos_capability_classification.py

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "${BASE_SHA}" ]; then
            git diff --check "${BASE_SHA}" "${HEAD_SHA}"
          else
            git show --check --format= "${HEAD_SHA}"
          fi

  flash:
    name: flash-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: components/flash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Flash Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: flash-cargo-${{ runner.os }}-${{ hashFiles('components/flash/Cargo.lock') }}
          restore-keys: flash-cargo-${{ runner.os }}-

      - name: Activate the pinned Flash toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  image:
    name: image-and-runtime
    if: >-
      needs.quality.outputs.qualify_image == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false)
    needs: [quality, flash]
    uses: ./.github/workflows/_image.yml
    with:
      artifact-name: flashos-x86_64-ci-${{ github.sha }}
      retention-days: 7
    permissions:
      contents: read

  required:
    name: required
    if: always()
    needs: [quality, flash, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize and enforce every gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          QUALIFY_IMAGE: ${{ needs.quality.outputs.qualify_image }}
          ROOT_RESULT: ${{ needs.quality.result }}
          SHELL_RESULT: ${{ needs.flash.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          set -euo pipefail
          {
            echo "## FlashOS CI"
            echo
            echo "| gate | result |"
            echo "|:--|:--|"
            echo "| repository + product contract | ${ROOT_RESULT} |"
            echo "| Flash | ${SHELL_RESULT} |"
            echo "| Docker image + QEMU runtime | ${IMAGE_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          for result in \
            "${ROOT_RESULT}" \
            "${SHELL_RESULT}"
          do
            if [ "${result}" != "success" ]; then
              echo "::error::one or more required CI gates failed"
              exit 1
            fi
          done

          if [ "${IMAGE_RESULT}" = "success" ]; then
            exit 0
          fi

          if [ "${IMAGE_RESULT}" != "skipped" ]; then
            echo "::error::image qualification did not succeed"
            exit 1
          fi

          if [ "${QUALIFY_IMAGE}" != "true" ]; then
            exit 0
          fi

          if [ "${EVENT_NAME}" = "pull_request" ] &&
             [ "${PR_DRAFT}" = "true" ]; then
            exit 0
          fi

          echo "::error::required image qualification was unexpectedly skipped"
          exit 1
