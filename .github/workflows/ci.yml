name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: build-system-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: root-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: root-cargo-${{ runner.os }}-

      - name: Activate the pinned root toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Formatting
        run: cargo fmt --all --check

      - name: Build-system tests
        run: cargo test --locked

  flash:
    name: flash-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: components/flash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Flash Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: flash-cargo-${{ runner.os }}-${{ hashFiles('components/flash/Cargo.lock') }}
          restore-keys: flash-cargo-${{ runner.os }}-

      - name: Activate the pinned Flash toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  product-contract:
    name: tui-product-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Product contracts, the QEMU harness, and host developer tools are held
      # to the same source-quality standard as the Rust workspaces.
      - name: Check the FlashOS Python
        run: |
          pipx install ruff==0.16.0
          ruff check ci/ tools/flashos/
          python3 -m unittest discover -s tools/flashos/tests -p 'test_*.py'

      - name: Validate package, TUI, shell, identity, and audio policy
        run: python3 ci/check_profile.py

      - name: Reject whitespace errors
        run: git diff --check HEAD

  image:
    name: image-and-runtime
    needs: [quality, flash, product-contract]
    uses: ./.github/workflows/_image.yml
    with:
      artifact-name: flashos-x86_64-ci-${{ github.sha }}
      retention-days: 7
    permissions:
      contents: read

  required:
    name: required
    if: always()
    needs: [quality, flash, product-contract, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize and enforce every gate
        env:
          ROOT_RESULT: ${{ needs.quality.result }}
          SHELL_RESULT: ${{ needs.flash.result }}
          CONTRACT_RESULT: ${{ needs.product-contract.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          set -euo pipefail
          {
            echo "## FlashOS CI"
            echo
            echo "| gate | result |"
            echo "|:--|:--|"
            echo "| build system | ${ROOT_RESULT} |"
            echo "| Flash | ${SHELL_RESULT} |"
            echo "| TUI product contract | ${CONTRACT_RESULT} |"
            echo "| Docker image + QEMU runtime | ${IMAGE_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          for result in \
            "${ROOT_RESULT}" \
            "${SHELL_RESULT}" \
            "${CONTRACT_RESULT}" \
            "${IMAGE_RESULT}"
          do
            if [ "${result}" != "success" ]; then
              echo "::error::one or more required CI gates failed"
              exit 1
            fi
          done
