name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: repository-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: root-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: root-cargo-${{ runner.os }}-

      - name: Activate the pinned root toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Formatting
        run: cargo fmt --all --check

      - name: Build-system tests
        run: cargo test --locked

      # Product contracts, the QEMU harness, and host developer tools are held
      # to the same source-quality standard as the Rust workspaces.
      - name: Check the FlashOS Python
        run: |
          pipx install ruff==0.16.0
          ruff check ci/ tools/flashos/
          python3 -m unittest discover -s ci/tests -p 'test_*.py'
          python3 -m unittest discover -s tools/flashos/tests -p 'test_*.py'

      - name: Validate package, TUI, shell, identity, and audio policy
        run: python3 ci/check_profile.py

      - name: Validate the FlashOS platform source baseline
        run: python3 ci/check_flashos_platform.py

      - name: Validate the FlashOS capability evidence inventory
        run: python3 ci/check_flashos_capabilities.py

      - name: Validate the FlashOS platform operation map
        run: python3 ci/check_flashos_operation_map.py

      - name: Validate the FlashOS platform capability classification
        run: python3 ci/check_flashos_capability_classification.py

      - name: Validate the versioned FlashOS capability report
        run: python3 ci/check_flashos_capability_report.py

      - name: Validate the FlashOS target capability matrix
        run: python3 ci/check_flashos_target_matrix.py

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "${BASE_SHA}" ]; then
            git diff --check "${BASE_SHA}" "${HEAD_SHA}"
          else
            git show --check --format= "${HEAD_SHA}"
          fi

  flash:
    name: flash-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: components/flash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Cache Flash Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: flash-cargo-${{ runner.os }}-${{ hashFiles('components/flash/Cargo.lock') }}
          restore-keys: flash-cargo-${{ runner.os }}-

      - name: Activate the pinned Flash toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Validate the Flash v1 conformance inventory
        run: python3 ../../ci/check_flash_conformance.py

      - name: Validate the Flash performance contract
        run: python3 ../../ci/flash_benchmarks.py

      - name: Host v1 conformance and workspace tests
        run: cargo test --workspace --locked

      - name: Run the bounded Flash benchmark smoke
        run: python3 benchmarks/run.py --profile smoke

  image:
    name: image-and-runtime
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false)
    needs: [quality, flash]
    uses: ./.github/workflows/_image.yml
    with:
      artifact-name: flashos-x86_64-ci-${{ github.event.pull_request.head.sha || github.sha }}
      retention-days: 7
      release-evidence: false
    permissions:
      contents: read

  required:
    name: required
    if: always()
    needs: [quality, flash, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize and enforce every gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          ROOT_RESULT: ${{ needs.quality.result }}
          SHELL_RESULT: ${{ needs.flash.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          set -euo pipefail
          {
            echo "## FlashOS CI"
            echo
            echo "| gate | result |"
            echo "|:--|:--|"
            echo "| repository + product contract | ${ROOT_RESULT} |"
            echo "| Flash | ${SHELL_RESULT} |"
            echo "| Docker image + QEMU runtime | ${IMAGE_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          for result in \
            "${ROOT_RESULT}" \
            "${SHELL_RESULT}"
          do
            if [ "${result}" != "success" ]; then
              echo "::error::one or more required CI gates failed"
              exit 1
            fi
          done

          if [ "${IMAGE_RESULT}" = "success" ]; then
            exit 0
          fi

          if [ "${EVENT_NAME}" = "pull_request" ] &&
             [ "${PR_DRAFT}" = "true" ] &&
             [ "${IMAGE_RESULT}" = "skipped" ]; then
            exit 0
          fi

          echo "::error::ready candidates require successful product qualification"
          exit 1
