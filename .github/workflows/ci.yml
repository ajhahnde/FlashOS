name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      cold-cache:
        description: Run without restoring or saving build caches.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: change-classification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FLASH_AUTOMATION_RUNTIME: ${{ github.workspace }}/build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh
      FLASH_AUTOMATION_JQ: ${{ github.workspace }}/build/flash-automation-tools/linux-x86_64/bin/jq
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
      image_required: ${{ steps.classify.outputs.image_required }}
      target_required: ${{ steps.classify.outputs.target_required }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Acquire the immutable Flash 1.0 automation runtime
        run: make flash-bootstrap

      - name: Acquire the pinned public automation tools
        run: make flash-automation-tools

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" |
              build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/classify_changes.fsh --null
          else
            build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/classify_changes.fsh </dev/null
          fi

  quality:
    name: repository-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLASH_AUTOMATION_RUNTIME: ${{ github.workspace }}/build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh
      FLASH_AUTOMATION_JQ: ${{ github.workspace }}/build/flash-automation-tools/linux-x86_64/bin/jq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Acquire the immutable Flash 1.0 automation runtime
        run: make flash-bootstrap

      - name: Acquire the pinned public automation tools
        run: make flash-automation-tools

      - name: Cache Cargo downloads
        if: inputs['cold-cache'] != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: root-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: root-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache root Cargo build outputs
        if: inputs['cold-cache'] != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: root-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-test

      - name: Activate the pinned root toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Formatting
        run: cargo fmt --all --check

      - name: Build-system tests
        run: cargo test --locked

      # Product contracts and the QEMU harness are held to the same
      # source-quality standard as the Rust workspaces.
      - name: Check the FlashOS Python
        run: |
          pipx install ruff==0.16.0
          ruff check ci/
          python3 -m unittest discover -s ci/tests -p 'test_*.py'

      - name: Validate the public automation inventory
        run: python3 ci/check_public_automation.py

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "${BASE_SHA}" ]; then
            git diff --check "${BASE_SHA}" "${HEAD_SHA}"
          else
            git show --check --format= "${HEAD_SHA}"
          fi

  flash:
    name: flash-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLASH_AUTOMATION_RUNTIME: ${{ github.workspace }}/build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh
      FLASH_AUTOMATION_TAPLO: ${{ github.workspace }}/build/flash-automation-tools/linux-x86_64/bin/taplo
      FLASH_AUTOMATION_JQ: ${{ github.workspace }}/build/flash-automation-tools/linux-x86_64/bin/jq
      FLASH_AUTOMATION_RG: ${{ github.workspace }}/build/flash-automation-tools/linux-x86_64/bin/rg
      FLASH_AUTOMATION_READELF: /usr/bin/readelf
      FLASH_V1_BOOTSTRAP_FSH: ${{ github.workspace }}/build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh
    defaults:
      run:
        working-directory: components/flash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Cache Flash Cargo downloads
        if: inputs['cold-cache'] != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: flash-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('components/flash/rust-toolchain.toml', 'components/flash/Cargo.lock') }}
          restore-keys: flash-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Flash Cargo build outputs
        if: inputs['cold-cache'] != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: components/flash/target
          key: flash-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('components/flash/rust-toolchain.toml', 'components/flash/Cargo.lock', 'components/flash/Cargo.toml') }}-all-targets-test

      - name: Activate the pinned Flash toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Host v1 conformance and workspace tests
        run: cargo test --workspace --locked

      - name: Acquire the immutable Flash 1.0 automation runtime
        working-directory: ${{ github.workspace }}
        run: make flash-bootstrap

      - name: Acquire the pinned public automation tools
        working-directory: ${{ github.workspace }}
        run: make flash-automation-tools

      - name: Validate the developer command interface
        working-directory: ${{ github.workspace }}
        run: build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/check_developer_interface.fsh

      - name: Validate package, TUI, shell, identity, and audio policy
        working-directory: ${{ github.workspace }}
        run: build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/check_profile.fsh

      - name: Validate the FlashOS platform source baseline
        working-directory: ${{ github.workspace }}
        run: build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/check_flashos_platform.fsh

      - name: Validate the FlashOS capability evidence inventory
        working-directory: ${{ github.workspace }}
        run: build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/check_flashos_capabilities.fsh

      - name: Validate the FlashOS platform operation map
        working-directory: ${{ github.workspace }}
        run: build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/check_flashos_operation_map.fsh

      - name: Validate the FlashOS platform capability classification
        working-directory: ${{ github.workspace }}
        run: build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/check_flashos_capability_classification.fsh

      - name: Validate the Flash v1 conformance inventory
        working-directory: ${{ github.workspace }}
        run: build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/check_flash_conformance.fsh

      - name: Validate the Flash 1.0.0 release contract
        working-directory: ${{ github.workspace }}
        run: build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/check_flash_release.fsh

      - name: Validate the versioned FlashOS capability report
        working-directory: ${{ github.workspace }}
        run: build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/check_flashos_capability_report.fsh

      - name: Validate the FlashOS target capability matrix
        working-directory: ${{ github.workspace }}
        run: build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/check_flashos_target_matrix.fsh

      - name: Validate the exhaustive Flash v1 exercise contract
        working-directory: ${{ github.workspace }}
        run: build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/check_flash_v1_exercises.fsh

      - name: Validate the Flash performance contract
        working-directory: ${{ github.workspace }}
        run: >-
          build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh
          ci/flash_benchmarks.fsh

      - name: Test the Flash performance contract
        working-directory: ${{ github.workspace }}
        run: build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/tests/test_flash_benchmarks.fsh

      - name: Exercise FlashOS public automation through Flash
        working-directory: ${{ github.workspace }}
        run: >-
          python3 ci/check_public_automation.py
          --bootstrap-runtime
          build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh
          --runtime components/flash/target/debug/fsh

      - name: Execute the exhaustive Flash v1 host exercises
        working-directory: ${{ github.workspace }}
        run: components/flash/target/debug/fsh components/flash/exercises/run.fsh --profile ci --no-build

      - name: Run the bounded Flash benchmark smoke
        run: python3 benchmarks/run.py --profile smoke

  image:
    name: image-and-runtime
    if: >-
      needs.scope.outputs.image_required == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false)
    needs: [scope, quality, flash]
    uses: ./.github/workflows/_image.yml
    with:
      artifact-name: flashos-x86_64-ci-${{ github.event.pull_request.head.sha || github.sha }}
      retention-days: 7
      release-evidence: false
      source-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      cold-cache: ${{ inputs['cold-cache'] || false }}
    permissions:
      contents: read

  required:
    name: required
    if: always()
    needs: [scope, quality, flash, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FLASH_AUTOMATION_RUNTIME: ${{ github.workspace }}/build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh
      FLASH_AUTOMATION_JQ: ${{ github.workspace }}/build/flash-automation-tools/linux-x86_64/bin/jq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Acquire the immutable Flash 1.0 automation runtime
        run: make flash-bootstrap

      - name: Acquire the pinned public automation tools
        run: make flash-automation-tools

      - name: Summarize and enforce every gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          LANE: ${{ needs.scope.outputs.lane }}
          IMAGE_REQUIRED: ${{ needs.scope.outputs.image_required }}
          TARGET_REQUIRED: ${{ needs.scope.outputs.target_required }}
          CLASSIFICATION: ${{ needs.scope.outputs.classification }}
          ROOT_RESULT: ${{ needs.quality.result }}
          SHELL_RESULT: ${{ needs.flash.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/aggregate_ci.fsh
