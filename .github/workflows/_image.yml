name: reusable image qualification

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Immutable workflow-artifact name.
        required: true
        type: string
      retention-days:
        description: Artifact retention period.
        required: false
        default: 7
        type: number
      config-name:
        description: >-
          Image profile under config/x86_64. CI qualifies the development
          profile; a release must build the profile without convenience logins.
        required: false
        default: flashos
        type: string

permissions:
  contents: read

jobs:
  build:
    name: docker-clean-room-build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the FlashOS CI container
        run: >-
          docker build
          --file ci/container/Dockerfile
          --tag "flashos-ci:${GITHUB_SHA}"
          .

      - name: Build the x86_64 disk and live images in the clean container
        env:
          CONFIG_NAME: ${{ inputs.config-name }}
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env CI=1 \
            "flashos-ci:${GITHUB_SHA}" \
            make \
              ARCH=x86_64 \
              "CONFIG_NAME=${CONFIG_NAME}" \
              PODMAN_BUILD=0 \
              SKIP_CHECK_TOOLS=1 \
              REPO_BINARY=1 \
              REPO_NONSTOP=0 \
              FSTOOLS_NO_MOUNT=1 \
              "build/x86_64/${CONFIG_NAME}/harddrive.img" \
              "build/x86_64/${CONFIG_NAME}/redox-live.iso"

      # Every package installed into the image is staged under its recipe as
      # target/<triple>/stage before it is packed. Scanning those trees
      # describes what the image actually contains, which a scan of the
      # repository working tree does not.
      - name: Collect the staged image payload
        run: |
          set -euo pipefail
          # dist/image must exist before the SBOM step, which writes into it
          # one step earlier than the images are staged there.
          mkdir -p dist/payload dist/image
          found=0
          while IFS= read -r stage; do
            recipe="$(basename "$(dirname "$(dirname "$(dirname "${stage}")")")")"
            mkdir -p "dist/payload/${recipe}"
            cp -a "${stage}/." "dist/payload/${recipe}/"
            found=$((found + 1))
          done < <(find recipes -type d -path "*/target/x86_64-unknown-redox/stage")
          if [ "${found}" -eq 0 ]; then
            echo "::error::no staged package payload found; the image SBOM would be empty"
            exit 1
          fi
          echo "staged payload collected from ${found} recipes"

      - name: Generate the image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        env:
          SYFT_SOURCE_NAME: FlashOS-x86_64-image
        with:
          path: dist/payload
          format: cyclonedx-json
          output-file: dist/image/FlashOS-x86_64-image.cdx.json
          upload-artifact: false

      - name: Stage the immutable images
        env:
          CONFIG_NAME: ${{ inputs.config-name }}
        run: |
          set -euo pipefail
          mkdir -p dist/image
          cp "build/x86_64/${CONFIG_NAME}/harddrive.img" \
            dist/image/FlashOS-x86_64-harddrive.img
          cp "build/x86_64/${CONFIG_NAME}/redox-live.iso" \
            dist/image/FlashOS-x86_64-live.iso
          # Bind the SBOM to the artifacts it describes and give it a component
          # list. Syft finds nothing in the staged payload on its own: these are
          # bare Redox ELF binaries with no package manifest for it to read. The
          # authoritative inventory is the recipe set that produced them, and
          # every shipped recipe now carries a pinned revision.
          python3 - <<'BIND'
          import hashlib, json, pathlib, re, tomllib

          image_dir = pathlib.Path("dist/image")
          sbom_path = image_dir / "FlashOS-x86_64-image.cdx.json"
          sbom = json.loads(sbom_path.read_text())

          def digest(name: str) -> str:
              return hashlib.sha256((image_dir / name).read_bytes()).hexdigest()

          def recipe_for(name: str) -> pathlib.Path | None:
              matches = sorted(pathlib.Path("recipes").glob(f"*/{name}/recipe.toml"))
              return matches[0] if matches else None

          components = list(sbom.get("components", []))
          described = {component.get("name") for component in components}
          for payload in sorted(pathlib.Path("dist/payload").iterdir()):
              if not payload.is_dir() or payload.name in described:
                  continue
              recipe_path = recipe_for(payload.name)
              if recipe_path is None:
                  continue
              source = tomllib.loads(recipe_path.read_text()).get("source", {})
              revision = source.get("rev")
              entry = {
                  "type": "library",
                  "name": payload.name,
                  "purl": f"pkg:generic/{payload.name}"
                  + (f"@{revision}" if revision else ""),
              }
              if "git" in source:
                  entry["version"] = revision or "unpinned"
                  entry["externalReferences"] = [
                      {"type": "vcs", "url": source["git"]}
                  ]
              elif "tar" in source:
                  # A release tarball, identified by its content hash rather
                  # than a revision.
                  checksum = source.get("blake3")
                  match = re.search(r"-([0-9][^/]*?)\.tar", source["tar"])
                  entry["version"] = (
                      match.group(1) if match else (checksum or "unpinned")
                  )
                  entry["purl"] = f"pkg:generic/{payload.name}@{entry['version']}"
                  entry["externalReferences"] = [
                      {"type": "distribution", "url": source["tar"]}
                  ]
                  if checksum:
                      entry["hashes"] = [{"alg": "BLAKE3", "content": checksum}]
              else:
                  # No upstream source of its own: the recipe copies artifacts
                  # out of the cross-toolchain sysroot the gcc recipe built.
                  entry["version"] = "sysroot"
                  entry["description"] = (
                      "Copied from the cross-toolchain sysroot; it has no "
                      "upstream revision of its own."
                  )
              components.append(entry)

          if not components:
              raise SystemExit("image SBOM would ship with no components")

          sbom["components"] = components
          metadata = sbom.setdefault("metadata", {})
          component = metadata.setdefault("component", {})
          component["type"] = "operating-system"
          component["name"] = "FlashOS"
          properties = component.setdefault("properties", [])
          for artifact in ("FlashOS-x86_64-harddrive.img", "FlashOS-x86_64-live.iso"):
              properties.append(
                  {
                      "name": f"flashos:artifact:{artifact}:sha256",
                      "value": digest(artifact),
                  }
              )
          sbom_path.write_text(json.dumps(sbom, indent=2))
          print(f"image SBOM describes {len(components)} components")
          BIND
          (
            cd dist/image
            sha256sum \
              FlashOS-x86_64-harddrive.img \
              FlashOS-x86_64-live.iso \
              FlashOS-x86_64-image.cdx.json \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload the images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/image/
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  boot:
    name: qemu-artifact-consumer
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CONFIG_NAME: ${{ inputs.config-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: Download the promoted image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/image

      - name: Verify image integrity
        working-directory: dist/image
        run: sha256sum --check SHA256SUMS

      # A locked root account is a property of the release profile only, so the
      # assertion is opt-in. Every other assertion holds for both profiles and
      # needs no flag. An unrecognised profile fails rather than silently
      # dropping the flag: a security assertion that can be skipped by a typo
      # is worse than no assertion, because the run still reports success.
      - name: Boot the exact harddrive image over NVMe
        run: |
          set -euo pipefail
          smoke_flags=()
          case "$CONFIG_NAME" in
            flashos) ;;
            flashos-release) smoke_flags+=(--expect-root-locked) ;;
            *) echo "::error::unknown image profile: $CONFIG_NAME"; exit 1 ;;
          esac
          python3 ci/qemu_smoke.py \
            --image dist/image/FlashOS-x86_64-harddrive.img \
            --disk-interface nvme \
            --log dist/qemu-harddrive-smoke.log \
            --timeout 180 \
            "${smoke_flags[@]}"

      - name: Boot the exact live image over USB
        run: |
          set -euo pipefail
          smoke_flags=()
          case "$CONFIG_NAME" in
            flashos) ;;
            flashos-release) smoke_flags+=(--expect-root-locked) ;;
            *) echo "::error::unknown image profile: $CONFIG_NAME"; exit 1 ;;
          esac
          python3 ci/qemu_smoke.py \
            --image dist/image/FlashOS-x86_64-live.iso \
            --disk-interface usb \
            --log dist/qemu-live-usb-smoke.log \
            --timeout 180 \
            "${smoke_flags[@]}"

      - name: Upload boot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-boot-failure-${{ github.sha }}
          path: |
            dist/qemu-harddrive-smoke.log
            dist/qemu-live-usb-smoke.log
            dist/image/SHA256SUMS
          retention-days: 14
          if-no-files-found: warn
