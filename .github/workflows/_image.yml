name: reusable image qualification

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Immutable workflow-artifact name.
        required: true
        type: string
      retention-days:
        description: Artifact retention period.
        required: false
        default: 7
        type: number
      config-name:
        description: >-
          Image profile under config/x86_64. CI qualifies the development
          profile; a release must build the profile without convenience logins.
        required: false
        default: flashos
        type: string
      release-evidence:
        description: Build and qualify live media and generate the image SBOM.
        required: false
        default: false
        type: boolean
      source-ref:
        description: Exact commit to build and qualify.
        required: false
        default: ""
        type: string
      cold-cache:
        description: Disable BuildKit cache restore and save for diagnostics.
        required: false
        default: false
        type: boolean
      runtime-evidence-name:
        description: Workflow artifact name for QEMU logs and results.
        required: false
        default: qemu-evidence
        type: string

permissions:
  contents: read

jobs:
  build:
    name: docker-clean-room-build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.event.pull_request.head.sha || github.sha }}

      - name: Prepare the BuildKit builder
        run: docker buildx create --driver docker-container --use --name flashos-ci

      - name: Build the FlashOS CI container
        env:
          COLD_CACHE: ${{ inputs.cold-cache }}
          CACHE_SCOPE: flashos-ci-v1-${{ hashFiles('ci/container/Dockerfile', 'rust-toolchain.toml') }}
          SOURCE_REF: ${{ inputs.source-ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cache_args=()
          if [ "${COLD_CACHE}" = "true" ]; then
            cache_args+=(--no-cache)
          else
            cache_args+=(
              --cache-from "type=gha,scope=${CACHE_SCOPE}"
              --cache-to "type=gha,mode=max,scope=${CACHE_SCOPE},ignore-error=true"
            )
          fi
          docker buildx build \
            --load \
            --file ci/container/Dockerfile \
            --tag "flashos-ci:${SOURCE_REF}" \
            "${cache_args[@]}" \
            .

      - name: Build the qualified x86_64 images in the clean container
        env:
          CONFIG_NAME: ${{ inputs.config-name }}
          RELEASE_EVIDENCE: ${{ inputs.release-evidence }}
          SOURCE_REF: ${{ inputs.source-ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # The hosted checkout belongs to the runner UID, while the build
          # container runs as root. Trust only the fixed source mount so Git
          # can snapshot the in-tree Flash workspace without weakening its
          # ownership check for any other path.
          # Candidate and release images cook the selected recipes from their
          # tracked sources. The transitional binary feed is moving and can
          # otherwise mix userland built from a different Redox tree with
          # FlashOS's pinned source-built kernel.
          targets=("build/x86_64/${CONFIG_NAME}/harddrive.img")
          if [ "${RELEASE_EVIDENCE}" = "true" ]; then
            targets+=("build/x86_64/${CONFIG_NAME}/redox-live.iso")
          fi
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env CI=1 \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/workspace \
            "flashos-ci:${SOURCE_REF}" \
            make \
              ARCH=x86_64 \
              "CONFIG_NAME=${CONFIG_NAME}" \
              PODMAN_BUILD=0 \
              SKIP_CHECK_TOOLS=1 \
              REPO_BINARY=0 \
              REPO_NONSTOP=0 \
              FSTOOLS_NO_MOUNT=1 \
              "${targets[@]}"

      - name: Record the selected recipe resolution
        if: inputs.release-evidence
        env:
          CONFIG_NAME: ${{ inputs.config-name }}
          SOURCE_REF: ${{ inputs.source-ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env CI=1 \
            "flashos-ci:${SOURCE_REF}" \
            make \
              ARCH=x86_64 \
              "CONFIG_NAME=${CONFIG_NAME}" \
              PODMAN_BUILD=0 \
              SKIP_CHECK_TOOLS=1 \
              REPO_BINARY=0 \
              REPO_NONSTOP=0 \
              FSTOOLS_NO_MOUNT=1 \
              repo-lock

      - name: Validate the FlashOS platform build baseline
        run: python3 ci/check_flashos_platform.py --artifacts

      # Every package installed into the image is staged under its recipe as
      # target/<triple>/stage before it is packed. Scanning those trees
      # describes what the image actually contains, which a scan of the
      # repository working tree does not.
      - name: Collect the staged image payload
        if: inputs.release-evidence
        run: |
          set -euo pipefail
          # dist/image must exist before the SBOM step, which writes into it
          # one step earlier than the images are staged there.
          mkdir -p dist/payload dist/image
          found=0
          while IFS= read -r stage; do
            recipe="$(basename "$(dirname "$(dirname "$(dirname "${stage}")")")")"
            mkdir -p "dist/payload/${recipe}"
            cp -a "${stage}/." "dist/payload/${recipe}/"
            found=$((found + 1))
          done < <(find recipes -type d -path "*/target/x86_64-unknown-redox/stage")
          if [ "${found}" -eq 0 ]; then
            echo "::error::no staged package payload found; the image SBOM would be empty"
            exit 1
          fi
          echo "staged payload collected from ${found} recipes"

      - name: Generate the image SBOM
        if: inputs.release-evidence
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        env:
          SYFT_SOURCE_NAME: FlashOS-x86_64-image
        with:
          path: dist/payload
          format: cyclonedx-json
          output-file: dist/image/FlashOS-x86_64-image.cdx.json
          upload-artifact: false

      - name: Stage the immutable images
        env:
          CONFIG_NAME: ${{ inputs.config-name }}
          RELEASE_EVIDENCE: ${{ inputs.release-evidence }}
        run: |
          set -euo pipefail
          mkdir -p dist/image
          cp "build/x86_64/${CONFIG_NAME}/harddrive.img" \
            dist/image/FlashOS-x86_64-harddrive.img
          if [ "${RELEASE_EVIDENCE}" = "true" ]; then
            cp "build/x86_64/${CONFIG_NAME}/redox-live.iso" \
              dist/image/FlashOS-x86_64-live.iso
            cp cookbook.lock dist/image/cookbook.lock
          fi
          # Bind the SBOM to the artifacts it describes and give it a component
          # list. Syft finds nothing in the staged payload on its own: these are
          # bare Redox ELF binaries with no package manifest for it to read. The
          # authoritative inventory is the recipe set that produced them.
          # External sources are pinned; in-tree Flash is bound to this exact
          # checkout through its filtered workspace snapshot.
          if [ "${RELEASE_EVIDENCE}" = "true" ]; then
          python3 - <<'BIND'
          import hashlib, json, pathlib, re, tomllib

          image_dir = pathlib.Path("dist/image")
          sbom_path = image_dir / "FlashOS-x86_64-image.cdx.json"
          sbom = json.loads(sbom_path.read_text())

          def digest(name: str) -> str:
              return hashlib.sha256((image_dir / name).read_bytes()).hexdigest()

          def recipe_for(name: str) -> pathlib.Path | None:
              matches = sorted(pathlib.Path("recipes").glob(f"*/{name}/recipe.toml"))
              return matches[0] if matches else None

          components = list(sbom.get("components", []))
          described = {component.get("name") for component in components}
          for payload in sorted(pathlib.Path("dist/payload").iterdir()):
              if not payload.is_dir() or payload.name in described:
                  continue
              recipe_path = recipe_for(payload.name)
              if recipe_path is None:
                  continue
              source = tomllib.loads(recipe_path.read_text()).get("source", {})
              revision = source.get("rev")
              entry = {
                  "type": "library",
                  "name": payload.name,
                  "purl": f"pkg:generic/{payload.name}"
                  + (f"@{revision}" if revision else ""),
              }
              if "git" in source:
                  entry["version"] = revision or "unpinned"
                  entry["externalReferences"] = [
                      {"type": "vcs", "url": source["git"]}
                  ]
              elif "tar" in source:
                  # A release tarball, identified by its content hash rather
                  # than a revision.
                  checksum = source.get("blake3")
                  match = re.search(r"-([0-9][^/]*?)\.tar", source["tar"])
                  entry["version"] = (
                      match.group(1) if match else (checksum or "unpinned")
                  )
                  entry["purl"] = f"pkg:generic/{payload.name}@{entry['version']}"
                  entry["externalReferences"] = [
                      {"type": "distribution", "url": source["tar"]}
                  ]
                  if checksum:
                      entry["hashes"] = [{"alg": "BLAKE3", "content": checksum}]
              else:
                  # No upstream source of its own: the recipe copies artifacts
                  # out of the cross-toolchain sysroot the gcc recipe built.
                  entry["version"] = "sysroot"
                  entry["description"] = (
                      "Copied from the cross-toolchain sysroot; it has no "
                      "upstream revision of its own."
                  )
              components.append(entry)

          if not components:
              raise SystemExit("image SBOM would ship with no components")

          sbom["components"] = components
          metadata = sbom.setdefault("metadata", {})
          component = metadata.setdefault("component", {})
          component["type"] = "operating-system"
          component["name"] = "FlashOS"
          properties = component.setdefault("properties", [])
          for artifact in ("FlashOS-x86_64-harddrive.img", "FlashOS-x86_64-live.iso"):
              properties.append(
                  {
                      "name": f"flashos:artifact:{artifact}:sha256",
                      "value": digest(artifact),
                  }
              )
          sbom_path.write_text(json.dumps(sbom, indent=2))
          print(f"image SBOM describes {len(components)} components")
          BIND
          fi
          (
            cd dist/image
            artifacts=(FlashOS-x86_64-harddrive.img)
            if [ "${RELEASE_EVIDENCE}" = "true" ]; then
              artifacts+=(
                FlashOS-x86_64-live.iso
                FlashOS-x86_64-image.cdx.json
                cookbook.lock
              )
            fi
            sha256sum "${artifacts[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload the images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/image/
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  boot:
    name: qemu-artifact-consumer
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CONFIG_NAME: ${{ inputs.config-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.event.pull_request.head.sha || github.sha }}

      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: Download the promoted image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/image

      - name: Verify image integrity
        working-directory: dist/image
        run: sha256sum --check SHA256SUMS

      # A locked root account is a property of the release profile only, so the
      # assertion is opt-in. Every other assertion holds for both profiles and
      # needs no flag. An unrecognised profile fails rather than silently
      # dropping the flag: a security assertion that can be skipped by a typo
      # is worse than no assertion, because the run still reports success.
      - name: Boot the exact harddrive image over NVMe
        run: |
          set -euo pipefail
          smoke_flags=()
          case "$CONFIG_NAME" in
            flashos) ;;
            flashos-release) smoke_flags+=(--expect-root-locked --expect-passwordless-user) ;;
            *) echo "::error::unknown image profile: $CONFIG_NAME"; exit 1 ;;
          esac
          python3 ci/qemu_smoke.py \
            --image dist/image/FlashOS-x86_64-harddrive.img \
            --disk-interface nvme \
            --log dist/qemu-harddrive-smoke.log \
            --benchmark-output dist/qemu-harddrive-performance.json \
            --timeout 180 \
            "${smoke_flags[@]}"

      - name: Upload the target benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-performance-${{ inputs.source-ref || github.sha }}
          path: dist/qemu-harddrive-performance.json
          retention-days: 14
          if-no-files-found: warn

      - name: Boot the exact live image over USB
        if: inputs.release-evidence
        run: |
          set -euo pipefail
          smoke_flags=()
          case "$CONFIG_NAME" in
            flashos) ;;
            flashos-release) smoke_flags+=(--expect-root-locked --expect-passwordless-user) ;;
            *) echo "::error::unknown image profile: $CONFIG_NAME"; exit 1 ;;
          esac
          python3 ci/qemu_smoke.py \
            --image dist/image/FlashOS-x86_64-live.iso \
            --disk-interface usb \
            --log dist/qemu-live-usb-smoke.log \
            --timeout 180 \
            "${smoke_flags[@]}"

      - name: Record immutable QEMU results
        if: success()
        env:
          RELEASE_EVIDENCE: ${{ inputs.release-evidence }}
          SOURCE_REF: ${{ inputs.source-ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          image_dir = Path("dist/image")

          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          results = {
              "schema": 1,
              "source_commit": os.environ["SOURCE_REF"],
              "harddrive": {
                  "interface": "nvme",
                  "result": "success",
                  "attempt": 1,
                  "sha256": digest(image_dir / "FlashOS-x86_64-harddrive.img"),
                  "log": "qemu-harddrive-smoke.log",
              },
          }
          if os.environ["RELEASE_EVIDENCE"] == "true":
              results["live"] = {
                  "interface": "usb",
                  "result": "success",
                  "attempt": 1,
                  "sha256": digest(image_dir / "FlashOS-x86_64-live.iso"),
                  "log": "qemu-live-usb-smoke.log",
              }
          Path("dist/qemu-results.json").write_text(
              json.dumps(results, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload QEMU evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.runtime-evidence-name }}
          path: |
            dist/qemu-harddrive-smoke.log
            dist/qemu-harddrive-performance.json
            dist/qemu-live-usb-smoke.log
            dist/qemu-results.json
            dist/image/SHA256SUMS
          retention-days: 14
          if-no-files-found: warn
