name: Release candidate

on:
  workflow_dispatch:
    inputs:
      source-sha:
        description: Exact full commit SHA to qualify.
        type: string
        required: true
      version:
        description: Semantic FlashOS version without a leading v.
        type: string
        required: true
      release-notes-path:
        description: Reviewed repository-relative Markdown release notes.
        type: string
        default: CHANGELOG.md
      cold-cache:
        description: Build without restoring or saving BuildKit cache layers.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: candidate-${{ inputs['source-sha'] }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate-source-and-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FLASH_AUTOMATION_RUNTIME: ${{ github.workspace }}/build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh
      FLASH_AUTOMATION_JQ: ${{ github.workspace }}/build/flash-automation-tools/linux-x86_64/bin/jq
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      source_tree: ${{ steps.evidence.outputs.source_tree }}
      required_run_id: ${{ steps.evidence.outputs.required_run_id }}
      security_run_id: ${{ steps.evidence.outputs.security_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs['source-sha'] }}
          fetch-depth: 0

      - name: Acquire the immutable Flash 1.0 automation runtime
        run: make flash-bootstrap

      - name: Acquire the pinned public automation tools
        run: make flash-automation-tools

      - name: Validate exact source and version
        env:
          SOURCE_SHA: ${{ inputs['source-sha'] }}
          VERSION: ${{ inputs.version }}
          NOTES_PATH: ${{ inputs['release-notes-path'] }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$(git rev-parse HEAD)" != "${SOURCE_SHA}" ]; then
            echo "::error::source-sha must name the exact checked-out commit"
            exit 1
          fi
          source versions.env
          if [ "${VERSION}" != "${FLASHOS_RELEASE_VERSION}" ]; then
            echo "::error::candidate version differs from versions.env"
            exit 1
          fi
          if [[ "${NOTES_PATH}" = /* || "${NOTES_PATH}" = *..* ]] ||
             [ ! -f "${NOTES_PATH}" ] || [[ "${NOTES_PATH}" != *.md ]]; then
            echo "::error::release notes must be repository-relative Markdown"
            exit 1
          fi

      - name: Verify required and security evidence
        id: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs['source-sha'] }}
        run: build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/check_candidate_qualification.fsh

  image:
    name: release-image-and-runtime
    needs: validate
    uses: ./.github/workflows/_image.yml
    with:
      artifact-name: flashos-release-images-${{ github.run_id }}-${{ github.run_attempt }}
      runtime-evidence-name: flashos-release-qemu-${{ github.run_id }}-${{ github.run_attempt }}
      retention-days: 30
      config-name: flashos-release
      release-evidence: true
      source-ref: ${{ inputs['source-sha'] }}
      cold-cache: ${{ inputs['cold-cache'] }}
    permissions:
      contents: read

  package:
    name: immutable-candidate-bundle
    needs: [validate, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLASH_AUTOMATION_RUNTIME: ${{ github.workspace }}/build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh
      FLASH_AUTOMATION_JQ: ${{ github.workspace }}/build/flash-automation-tools/linux-x86_64/bin/jq
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs['source-sha'] }}
          fetch-depth: 0

      - name: Acquire the immutable Flash 1.0 automation runtime
        run: make flash-bootstrap

      - name: Acquire the pinned public automation tools
        run: make flash-automation-tools

      - name: Prepare the source SBOM destination
        run: mkdir -p dist/candidate

      - name: Generate the source SBOM before downloading binaries
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        env:
          SYFT_SOURCE_NAME: FlashOS-source
          SYFT_SOURCE_VERSION: ${{ inputs.version }}
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/candidate/FlashOS-${{ inputs.version }}-source.cdx.json
          upload-artifact: false

      - name: Download the once-built release images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flashos-release-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/input

      - name: Download the QEMU consumer evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flashos-release-qemu-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/evidence

      - name: Package the qualified bytes and evidence
        env:
          VERSION: ${{ inputs.version }}
          NOTES_PATH: ${{ inputs['release-notes-path'] }}
        run: |
          set -euo pipefail
          (cd dist/input && sha256sum --check SHA256SUMS)
          zstd --threads=0 --ultra -19 \
            dist/input/FlashOS-x86_64-harddrive.img \
            -o "dist/candidate/FlashOS-${VERSION}-x86_64-harddrive.img.zst"
          zstd --threads=0 --ultra -19 \
            dist/input/FlashOS-x86_64-live.iso \
            -o "dist/candidate/FlashOS-${VERSION}-x86_64-live.iso.zst"
          cp dist/input/FlashOS-x86_64-image.cdx.json \
            "dist/candidate/FlashOS-${VERSION}-image.cdx.json"
          cp dist/input/cookbook.lock dist/candidate/cookbook.lock
          cp "${NOTES_PATH}" "dist/candidate/FlashOS-${VERSION}-release-notes.md"
          cp \
            dist/evidence/qemu-harddrive-performance.json \
            dist/evidence/qemu-harddrive-smoke.log \
            dist/evidence/qemu-live-usb-smoke.log \
            dist/evidence/qemu-results.json \
            dist/candidate/
          (
            cd dist/candidate
            sha256sum \
              "FlashOS-${VERSION}-x86_64-harddrive.img.zst" \
              "FlashOS-${VERSION}-x86_64-live.iso.zst" \
              "FlashOS-${VERSION}-source.cdx.json" \
              "FlashOS-${VERSION}-image.cdx.json" \
              "FlashOS-${VERSION}-release-notes.md" \
              cookbook.lock \
              qemu-harddrive-performance.json \
              qemu-harddrive-smoke.log \
              qemu-live-usb-smoke.log \
              qemu-results.json \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Create and validate the candidate manifest
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs['source-sha'] }}
          SOURCE_TREE: ${{ needs.validate.outputs.source_tree }}
          REQUIRED_RUN_ID: ${{ needs.validate.outputs.required_run_id }}
          SECURITY_RUN_ID: ${{ needs.validate.outputs.security_run_id }}
        run: |
          set -euo pipefail
          build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/release_candidate.fsh create \
            --bundle dist/candidate \
            --version "${VERSION}" \
            --repository "${GITHUB_REPOSITORY}" \
            --source-commit "${SOURCE_SHA}" \
            --source-tree "${SOURCE_TREE}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --required-run-id "${REQUIRED_RUN_ID}" \
            --security-run-id "${SECURITY_RUN_ID}"
          build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/release_candidate.fsh validate \
            --bundle dist/candidate \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${VERSION}" \
            --source-commit "${SOURCE_SHA}" \
            --source-tree "${SOURCE_TREE}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --verify-compressed

      - name: Attest every candidate subject
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/candidate/*

      - name: Upload the immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flashos-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/candidate/
          retention-days: 30
          if-no-files-found: error
