name: Security

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: dependency-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FLASH_AUTOMATION_RUNTIME: ${{ github.workspace }}/build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh
      FLASH_AUTOMATION_JQ: ${{ github.workspace }}/build/flash-automation-tools/linux-x86_64/bin/jq
    outputs:
      qualify_security: ${{ steps.classify.outputs.security_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Acquire the immutable Flash 1.0 automation runtime
        run: make flash-bootstrap

      - name: Acquire the pinned public automation tools
        run: make flash-automation-tools

      # A stable aggregate check must exist for every pull request so it can
      # be required by repository rules. Only dependency-policy changes need
      # to repeat the underlying review and Cargo policy work.
      - name: Decide whether dependency qualification is needed
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" |
              build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/classify_changes.fsh --null
          else
            build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/classify_changes.fsh </dev/null
          fi

  dependency-review:
    name: dependency-review
    if: >-
      github.event_name == 'pull_request' &&
      needs.scope.outputs.qualify_security == 'true'
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject newly introduced high-severity dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  cargo-policy:
    name: cargo-policy
    if: needs.scope.outputs.qualify_security == 'true'
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

      - name: Flash advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: components/flash/Cargo.toml
          command: check advisories bans licenses sources

  required:
    name: security-required
    if: always()
    needs: [scope, dependency-review, cargo-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize and enforce dependency gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          QUALIFY_SECURITY: ${{ needs.scope.outputs.qualify_security }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          CARGO_RESULT: ${{ needs.cargo-policy.result }}
        run: |
          set -euo pipefail
          {
            echo "## FlashOS dependency policy"
            echo
            echo "| gate | result |"
            echo "|:--|:--|"
            echo "| dependency scope | ${SCOPE_RESULT} |"
            echo "| dependency review | ${DEPENDENCY_RESULT} |"
            echo "| Cargo policy | ${CARGO_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${SCOPE_RESULT}" != "success" ]; then
            echo "::error::dependency scope classification failed"
            exit 1
          fi

          if [ "${QUALIFY_SECURITY}" != "true" ]; then
            if [ "${DEPENDENCY_RESULT}" != "skipped" ] ||
               [ "${CARGO_RESULT}" != "skipped" ]; then
              echo "::error::dependency gates did not skip as classified"
              exit 1
            fi
            exit 0
          fi

          if [ "${CARGO_RESULT}" != "success" ]; then
            echo "::error::Cargo dependency policy failed"
            exit 1
          fi

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if [ "${DEPENDENCY_RESULT}" != "success" ]; then
              echo "::error::pull-request dependency review failed"
              exit 1
            fi
          elif [ "${DEPENDENCY_RESULT}" != "skipped" ]; then
            echo "::error::dependency review must run only for pull requests"
            exit 1
          fi
