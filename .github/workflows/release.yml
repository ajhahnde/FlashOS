name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only when this run is dispatched on a tag.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: rebuild-and-qualify
    uses: ./.github/workflows/_image.yml
    with:
      artifact-name: flashos-x86_64-release-${{ github.sha }}
      retention-days: 14
      config-name: flashos-release
    permissions:
      contents: read

  package:
    name: package
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and expose the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            expected="v${FLASHOS_RELEASE_VERSION}"
            if [ "${tag}" != "${expected}" ]; then
              echo "::error::tag ${tag} does not match versions.env (${expected})"
              exit 1
            fi
          else
            tag="v${FLASHOS_RELEASE_VERSION}-dev.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag is not semantic: ${tag}"
            exit 1
          fi
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Download the qualified images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flashos-x86_64-release-${{ github.sha }}
          path: dist/input

      - name: Verify and compress the qualified images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          (
            cd dist/input
            sha256sum --check SHA256SUMS
          )
          mkdir -p dist/release
          zstd --threads=0 --ultra -19 \
            dist/input/FlashOS-x86_64-harddrive.img \
            -o "dist/release/FlashOS-${VERSION}-x86_64-harddrive.img.zst"
          zstd --threads=0 --ultra -19 \
            dist/input/FlashOS-x86_64-live.iso \
            -o "dist/release/FlashOS-${VERSION}-x86_64-live.iso.zst"

      # Two SBOMs, named for what they actually describe. The source document
      # covers this repository and its Cargo graph; the image document is the
      # one produced next to the qualified image and covers what ships.
      - name: Generate the source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        env:
          SYFT_SOURCE_NAME: FlashOS-source
          SYFT_SOURCE_VERSION: ${{ steps.version.outputs.version }}
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/release/FlashOS-${{ steps.version.outputs.version }}-source.cdx.json
          upload-artifact: false

      - name: Promote the qualified image SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cp dist/input/FlashOS-x86_64-image.cdx.json \
            "dist/release/FlashOS-${VERSION}-image.cdx.json"

      - name: Checksum the release candidate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: dist/release
        run: |
          set -euo pipefail
          sha256sum \
            "FlashOS-${VERSION}-x86_64-harddrive.img.zst" \
            "FlashOS-${VERSION}-x86_64-live.iso.zst" \
            "FlashOS-${VERSION}-source.cdx.json" \
            "FlashOS-${VERSION}-image.cdx.json" \
            > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/FlashOS-${{ steps.version.outputs.version }}-x86_64-harddrive.img.zst
            dist/release/FlashOS-${{ steps.version.outputs.version }}-x86_64-live.iso.zst
            dist/release/FlashOS-${{ steps.version.outputs.version }}-source.cdx.json
            dist/release/FlashOS-${{ steps.version.outputs.version }}-image.cdx.json
            dist/release/SHA256SUMS

      - name: Upload the release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flashos-release-${{ steps.version.outputs.version }}
          path: dist/release/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: publish
    needs: package
    if: >-
      github.ref_type == 'tag' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flashos-release-${{ needs.package.outputs.version }}
          path: dist/release

      - name: Verify the release candidate
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          cd dist/release
          assets=(
            "FlashOS-${VERSION}-x86_64-harddrive.img.zst"
            "FlashOS-${VERSION}-x86_64-live.iso.zst"
            "FlashOS-${VERSION}-source.cdx.json"
            "FlashOS-${VERSION}-image.cdx.json"
            "SHA256SUMS"
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            gh release create "${TAG}" "${assets[@]}" \
              --title "FlashOS ${TAG}" \
              --generate-notes \
              --verify-tag
          fi
