name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing release tag (for example v0.2.0).
        type: string
        required: true
      candidate-run-id:
        description: Successful Release candidate workflow run ID.
        type: string
        required: true
      publish:
        description: Publish after validation; false is a non-publishing dry run.
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate-exact-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FLASH_AUTOMATION_RUNTIME: ${{ github.workspace }}/build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh
      FLASH_AUTOMATION_JQ: ${{ github.workspace }}/build/flash-automation-tools/linux-x86_64/bin/jq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Acquire the immutable Flash 1.0 automation runtime
        run: make flash-bootstrap

      - name: Acquire the pinned public automation tools
        run: make flash-automation-tools

      - name: Download the selected candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs['candidate-run-id'] }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] ||
             [[ ! "${CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::tag or candidate run ID has an invalid form"
            exit 1
          fi
          mkdir -p dist/selection
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" \
            > dist/selection/run.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?per_page=100" \
            > dist/selection/artifacts.json
          selection="$(build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/release_candidate.fsh select \
            --run dist/selection/run.json \
            --artifacts dist/selection/artifacts.json \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${CANDIDATE_RUN_ID}")"
          attempt="$(jq -r .run_attempt <<<"${selection}")"
          artifact="$(jq -r .artifact_name <<<"${selection}")"
          mkdir -p dist/release
          gh run download "${CANDIDATE_RUN_ID}" --name "${artifact}" --dir dist/release
          echo "${attempt}" > dist/candidate-run-attempt

      - name: Validate run, tag, tree, manifest, inventory, and checksums
        env:
          TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs['candidate-run-id'] }}
        run: |
          set -euo pipefail
          source versions.env
          if [ "${TAG}" != "v${FLASHOS_RELEASE_VERSION}" ]; then
            echo "::error::tag does not match versions.env"
            exit 1
          fi
          source_commit="$(git rev-parse "${TAG}^{commit}")"
          source_tree="$(git rev-parse "${TAG}^{tree}")"
          run_attempt="$(cat dist/candidate-run-attempt)"
          build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/release_candidate.fsh validate \
            --bundle dist/release \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${FLASHOS_RELEASE_VERSION}" \
            --source-commit "${source_commit}" \
            --source-tree "${source_tree}" \
            --run-id "${CANDIDATE_RUN_ID}" \
            --run-attempt "${run_attempt}" \
            --tag "${TAG}" \
            --verify-compressed

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::release ${TAG} already exists; published assets are immutable"
            exit 1
          fi

      - name: Record dry-run result
        if: inputs.publish != true
        run: echo "Candidate validated; no release was created." >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: publish-validated-bytes
    if: inputs.publish == true
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      FLASH_AUTOMATION_RUNTIME: ${{ github.workspace }}/build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh
      FLASH_AUTOMATION_JQ: ${{ github.workspace }}/build/flash-automation-tools/linux-x86_64/bin/jq
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Acquire the immutable Flash 1.0 automation runtime
        run: make flash-bootstrap

      - name: Acquire the pinned public automation tools
        run: make flash-automation-tools

      - name: Download the exact candidate again
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs['candidate-run-id'] }}
        run: |
          set -euo pipefail
          mkdir -p dist/selection dist/release
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" \
            > dist/selection/run.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?per_page=100" \
            > dist/selection/artifacts.json
          selection="$(build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/release_candidate.fsh select \
            --run dist/selection/run.json \
            --artifacts dist/selection/artifacts.json \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${CANDIDATE_RUN_ID}")"
          attempt="$(jq -r .run_attempt <<<"${selection}")"
          artifact="$(jq -r .artifact_name <<<"${selection}")"
          gh run download "${CANDIDATE_RUN_ID}" --name "${artifact}" --dir dist/release
          echo "${attempt}" > dist/candidate-run-attempt

      - name: Revalidate immediately before publication
        env:
          TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs['candidate-run-id'] }}
        run: |
          set -euo pipefail
          source versions.env
          build/flash-bootstrap/134635a5e1282b5d8455a4b2aeb754be5a3a77c1/fsh ci/release_candidate.fsh validate \
            --bundle dist/release \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${FLASHOS_RELEASE_VERSION}" \
            --source-commit "$(git rev-parse "${TAG}^{commit}")" \
            --source-tree "$(git rev-parse "${TAG}^{tree}")" \
            --run-id "${CANDIDATE_RUN_ID}" \
            --run-attempt "$(cat dist/candidate-run-attempt)" \
            --tag "${TAG}" \
            --verify-compressed

      - name: Publish without rebuilding or substituting assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::release ${TAG} already exists; published assets are immutable"
            exit 1
          fi
          assets=(dist/release/*)
          gh release create "${TAG}" "${assets[@]}" \
            --title "FlashOS ${TAG}" \
            --notes-file "dist/release/FlashOS-${TAG#v}-release-notes.md" \
            --verify-tag
