version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      routine-root-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /components/flash
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      routine-flash-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /system/api
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      routine-system-api-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:35"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      routine-actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /ci/container
    schedule:
      interval: weekly
      day: monday
      time: "05:50"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
