[package]
name = "flashos-system-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ajhahnde/FlashOS"
description = "Experimental local semantic system API for FlashOS"

[lib]
name = "flashos_system"

[[bin]]
name = "flashos-system"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
