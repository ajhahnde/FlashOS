# FlashOS console image, release variant
#
# Identical to the development profile in packages, files, and interface. The
# only difference is the credential model: the development profile carries
# convenience logins that must never reach a published artifact.
#
# Root is locked. `locked = true` writes an unmatchable hash, so no password
# verifies against it and the account cannot be logged into. Escalation is
# unaffected: sudo authenticates the invoking user and then switches to uid 0,
# so a member of the sudo group still reaches root.

include = ["../flashos-base.toml"]

[general]
filesystem_size = 160
create_xdg_user_dirs = false

[packages]
# TUI-only profile: no Orbital, COSMIC, X11, Wayland, or GUI installer.
flash = {}
coreutils = {}
extrautils = {}

[users.root]
locked = true
uid = 0
gid = 0
shell = "/usr/bin/fsh"

[users.user]
password = ""
shell = "/usr/bin/fsh"

[[files]]
path = "/etc/hostname"
data = "flashos"

[[files]]
path = "/usr/lib/os-release"
data = """
PRETTY_NAME="FlashOS 0.1.0"
NAME="FlashOS"
VERSION_ID="0.1.0"
VERSION="0.1.0"
ID="flashos"
ID_LIKE="redox-os"

HOME_URL="https://github.com/ajhahnde/FlashOS"
DOCUMENTATION_URL="https://github.com/ajhahnde/FlashOS#readme"
SUPPORT_URL="https://github.com/ajhahnde/FlashOS/issues"
"""

[[files]]
path = "/etc/issue"
data = "FlashOS 0.1.0\n"

[[files]]
path = "/usr/lib/init.d/30_console"
data = """
inputd -A 2
nowait getty 2
nowait getty /scheme/debug/no-preserve -J
"""
