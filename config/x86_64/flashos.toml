# FlashOS console image

include = ["../flashos-base.toml"]

[general]
filesystem_size = 160
create_xdg_user_dirs = false

[packages]
# TUI-only profile: no Orbital, COSMIC, X11, Wayland, or GUI installer.
flash = {}
coreutils = {}
extrautils = {}

[users.root]
password = "root"
uid = 0
gid = 0
shell = "/usr/bin/fsh"

[users.user]
password = "user"
shell = "/usr/bin/fsh"

[[files]]
path = "/etc/hostname"
data = "flashos"

[[files]]
path = "/usr/lib/os-release"
data = """
PRETTY_NAME="FlashOS 0.1.0"
NAME="FlashOS"
VERSION_ID="0.1.0"
VERSION="0.1.0"
ID="flashos"
ID_LIKE="redox-os"

HOME_URL="https://github.com/ajhahnde/FlashOS"
DOCUMENTATION_URL="https://github.com/ajhahnde/FlashOS#readme"
SUPPORT_URL="https://github.com/ajhahnde/FlashOS/issues"
"""

[[files]]
path = "/etc/issue"
data = "FlashOS 0.1.0\n"

[[files]]
path = "/usr/lib/init.d/30_console"
data = """
inputd -A 2
nowait getty 2
nowait getty /scheme/debug/no-preserve -J
"""
