[source]
# This builds the host installer that writes the image, so an unpinned source
# would let the same commit produce a differently built image. The patches below
# are written against this exact revision.
git = "https://gitlab.redox-os.org/redox-os/installer.git"
rev = "d7409a2cc6ebd44eab9f0c57551bb0b2798d21e1"
patches = [
    "flashos-tui-home.patch",
    "flashos-branding.patch",
    "flashos-locked-users.patch",
]

[build]
template = "cargo"
