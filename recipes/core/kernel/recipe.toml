[source]
git = "https://gitlab.redox-os.org/redox-os/kernel.git"
rev = "6230748accab004cc7359e5781b3f1f281e256d5"
patches = ["flashos-branding.patch"]

[build]
template = "custom"
script = """
cd "${COOKBOOK_SOURCE}"
make install BUILD="${COOKBOOK_BUILD}" DESTDIR="${COOKBOOK_STAGE}"

# Keep the complete kernel and symbols in COOKBOOK_BUILD for host debugging;
# the bootable runtime package needs only the installed kernel image.
rm -f \
    "${COOKBOOK_STAGE}/usr/lib/boot/kernel.all" \
    "${COOKBOOK_STAGE}/usr/lib/boot/kernel.sym"
"""
