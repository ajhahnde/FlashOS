[source]
# Pinned so a tagged image ships the shell from a known commit. Fetching the
# default branch let the image build a different fsh than the tag it carried.
# This revision must be bumped as part of preparing a release.
git = "https://github.com/ajhahnde/FlashOS"
rev = "23c402003a09dea644ef84b4758bf739264255b4"

[build]
template = "cargo"
cargopath = "components/flash/crates/flash-cli"
cargoflags = [
    "--bin fsh",
]
