# Meta-package for automated testing of essential test suites
# Smaller test suites are executed first to catch possible bugs or regressions faster
[build]
template = "custom"
script = """
mkdir -pv "${COOKBOOK_STAGE}/usr/bin"
cp -rv "${COOKBOOK_RECIPE}/auto-test.fsh" "${COOKBOOK_STAGE}/usr/bin/auto-test"
chmod +x "${COOKBOOK_STAGE}/usr/bin/auto-test"
"""
[package]
dependencies = [
    "acid",
    "coreutils",
    "flash",
    "os-test-bins.outputs",
    "relibc-tests-bins",
]
