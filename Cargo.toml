[package]
name = "flashos_build"
version = "0.1.0"
edition = "2024"
# This crate is the inherited build system. Every file under `src/` originates
# upstream and remains MIT-licensed; its retained copyright notice is in
# LICENSES/REDOX-BUILD-SYSTEM-MIT.
license = "MIT"
repository = "https://github.com/ajhahnde/FlashOS"
default-run = "repo"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "cookbook_redoxer"
path = "src/bin/cookbook_redoxer.rs"

[[bin]]
name = "repo"
path = "src/bin/repo.rs"

[[bin]]
name = "repo_builder"
path = "src/bin/repo_builder.rs"

[lib]
name = "cookbook"
path = "src/lib.rs"
doctest = false

[features]
#TODO: Actually make without tui feature works
default = ["tui"]
tui = ["ratatui", "ansi-to-tui", "strip-ansi-escapes"]

[dependencies]
blake3 = "1"
globset = "0.4"
libc = "0.2"
ignore = "0.4"
object = { version = "0.40", features = ["build_core"] }
# The transitional Git sources are pinned to the revisions Cargo.lock already
# resolves. A floating branch would let the same tag build a different toolchain.
pkgar = { git = "https://gitlab.redox-os.org/redox-os/pkgar.git", rev = "ee2bcb2af97eba496ebd8eaf44f5acbed452c4ec" }
pkgar-core = { git = "https://gitlab.redox-os.org/redox-os/pkgar.git", rev = "ee2bcb2af97eba496ebd8eaf44f5acbed452c4ec" }
pkgar-keys = { git = "https://gitlab.redox-os.org/redox-os/pkgar.git", rev = "ee2bcb2af97eba496ebd8eaf44f5acbed452c4ec" }
redox-pkg = { git = "https://gitlab.redox-os.org/redox-os/pkgutils.git", rev = "1250a77bf160a79492cf1943b3b2533b39ebba73", default-features = false }
redox_installer = { git = "https://gitlab.redox-os.org/redox-os/installer.git", rev = "1c2534e44c68ace0a21db2a1bc9503945a38c809", default-features = false }
redoxer = { git = "https://gitlab.redox-os.org/redox-os/redoxer.git", rev = "ad2c0790906057323473074ba381524d973332ee", default-features = false }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
termion = "4"
toml = "0.8"
walkdir = "2.3.1"
ansi-to-tui = { version = "8", optional = true }
strip-ansi-escapes = { version = "0.2.1", optional = true }
serde_json = "1"

[dependencies.ratatui]
version = "0.30"
default-features = false
features = ["termion"]
optional = true
